{% extends "base.html" %}

{% block content %}
<div class="container py-5 text-center">
    <h1 class="mb-3">Thank you!</h1>
    <p class="mb-1">Your order <strong>{{ order.order_number }}</strong> has been placed.</p>
    <p class="mb-4">A confirmation email will be sent to {{ order.email }}.</p>
    <a href="{% url 'products:product_list' %}" class="btn btn-teal">Keep Shopping</a>
</div>
{% endblock %}
